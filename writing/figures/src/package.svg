<svg id="fig-ag-package" viewBox="-2 -2 680 392" width="1360" height="784" role="img" aria-labelledby="fig-ag-package-title fig-ag-package-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-package-title">Most modules import only core, and core imports nothing</title>
<desc id="fig-ag-package-desc">Only the composition root (src/main.ts, src/host.ts) creates environment variables, PostgreSQL, Slack, the Agent SDK, fetch, and timers. Imports between modules are allowed only in the directions listed in the boundary test's table, and most modules import only the interfaces and types in src/core. The other allowed directions are session to slack and report, capabilities to lib, and main to every module. The 9 external integrations sit under capabilities, one folder per service: 5 have tools the model calls and 4 are used only by the bot code. core imports no other folder.</desc>
<defs><marker id="fig-ag-package-ah-bot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1c2433"/></marker></defs>
