<svg id="fig-ag-requests" viewBox="-2 -2 680 682" width="1360" height="1364" role="img" aria-labelledby="fig-ag-requests-title fig-ag-requests-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-requests-title">What you can ask the agent to do</title>
<desc id="fig-ag-requests-desc">Two inputs reach the agent: a person’s request, and Sentry alerts, which the agent analyzes without being called and, in designated repositories, fixes, opens a PR for, and deploys to the development and staging servers. The agent works on six targets: multiple code repositories (reads code and answers with file path and line numbers), databases in development, staging, and production (queries and uploads CSV; production is read-only and heavy queries show the execution plan first; writes go to development and staging), the issue tracker (finds, creates, edits tickets), a workspace and PR (fixes in an isolated workspace, another session reviews, then opens a PR), open PRs (finds, reads, comments, fixes, merges), and channel conversation history (finds posts with similar meaning). Items marked “Draft first” are posted as a draft and executed only after a person replies.</desc>
<defs><marker id="fig-ag-requests-ah-external" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f5bb7"/></marker><marker id="fig-ag-requests-ah-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker><marker id="fig-ag-requests-ah-human" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b26b00"/></marker></defs>
<style>#fig-ag-requests text{font-family:'Pretendard',sans-serif}
#fig-ag-requests .tt{font-size:18px;font-weight:700;fill:#0f172a}
#fig-ag-requests .st{font-size:12px;font-weight:400;fill:#334155}
#fig-ag-requests .hd{font-size:12px;font-weight:700;fill:#0f172a}
#fig-ag-requests .hs{font-size:11px;font-weight:500;fill:#64748b}
#fig-ag-requests .nm{font-size:12px;font-weight:600;fill:#0f172a}
#fig-ag-requests .qt{font-size:11px;font-weight:600;fill:#0f172a}
#fig-ag-requests .sb{font-size:11px;font-weight:400;fill:#475569}
#fig-ag-requests .ss{font-size:10.5px;font-weight:400;fill:#475569}
#fig-ag-requests .mn{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;font-weight:400;fill:#334155}
#fig-ag-requests .lb{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-requests .lg{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-requests .vl{font-size:11px;font-weight:600;fill:#334155}</style>
<rect x="-2" y="-2" width="680" height="682" fill="#ffffff"/>
<text class="hs" x="0" y="10">What you can ask the agent to do</text>
<text class="tt" x="0" y="34">What you can ask for</text>
<text class="st" x="0" y="54">Ask for something like this, and here is what the agent does and where</text>
<path d="M258,86 L283,86" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-requests-ah-grey)"/>
<path d="M258,156 L283,156" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-requests-ah-grey)"/>
<path d="M258,308 L283,308" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-requests-ah-grey)"/>
<path d="M258,392 L283,392" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-requests-ah-grey)"/>
<path d="M258,476 L283,476" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-requests-ah-grey)"/>
<path d="M258,560 L283,560" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-requests-ah-grey)"/>
<path d="M168,268 L191,268" fill="none" stroke="#b26b00" stroke-width="1" marker-end="url(#fig-ag-requests-ah-human)"/>
<path d="M168,322 L191,322" fill="none" stroke="#2f5bb7" stroke-width="1" marker-end="url(#fig-ag-requests-ah-external)"/>
<rect x="0" y="250" width="168" height="36" rx="6" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="nm" x="12" y="272" fill="#8a5300">When a person asks</text>
<rect x="0" y="304" width="168" height="176" rx="6" fill="#eef3fb" stroke="#2f5bb7" stroke-width="1"/>
<text class="nm" x="12" y="322" fill="#244a99">Sentry alerts</text>
<text class="ss" x="12" y="338">When one is posted to a</text>
<text class="ss" x="12" y="352">channel, it analyzes the</text>
<text class="ss" x="12" y="366">cause and replies in the</text>
<text class="ss" x="12" y="380">thread, without being</text>
<text class="ss" x="12" y="394">called.</text>
<text class="ss" x="12" y="412">In designated repositories</text>
<text class="ss" x="12" y="426">it fixes the problem,</text>
<text class="ss" x="12" y="440">opens a PR, and deploys to</text>
<text class="ss" x="12" y="454">the development and</text>
<text class="ss" x="12" y="468">staging servers.</text>
<rect x="192" y="72" width="66" height="548" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="2"/>
<text class="nm" x="225" y="350" text-anchor="middle" fill="#5a3fa6">Agent</text>
<rect x="284" y="72" width="392" height="60" rx="6" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="nm" x="296" y="90" fill="#3d4554">Multiple code repositories</text>
<text class="qt" x="296" y="106">“Which API does this screen call?”</text>
<text class="ss" x="296" y="121">Reads the code and answers with the source file path and line numbers</text>
<rect x="284" y="142" width="392" height="142" rx="6" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="nm" x="296" y="160" fill="#3d4554">Databases (development, staging, production)</text>
<text class="qt" x="296" y="176">“Why is this member’s status like this?”</text>
<text class="ss" x="296" y="191">Runs the query and, when the result has rows, uploads it</text>
<text class="ss" x="296" y="205">as a CSV file along with a summary</text>
<text class="ss" x="296" y="223">The production DB is read-only.</text>
<text class="ss" x="296" y="237">For a heavy query it shows the execution plan first</text>
<rect x="604" y="225" width="62" height="16" rx="3" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lb" x="635" y="237" text-anchor="middle" fill="#0b5e4f">Draft first</text>
<text class="qt" x="296" y="257">“Change some test data for me”</text>
<text class="ss" x="296" y="272">Writes to the development and staging DBs</text>
<rect x="604" y="260" width="62" height="16" rx="3" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lb" x="635" y="272" text-anchor="middle" fill="#0b5e4f">Draft first</text>
<rect x="284" y="294" width="392" height="74" rx="6" fill="#eef3fb" stroke="#2f5bb7" stroke-width="1"/>
<text class="nm" x="296" y="312" fill="#244a99">Issue tracker</text>
<text class="qt" x="296" y="328">“Make a ticket for this”</text>
<text class="ss" x="296" y="343">Finds, creates, and edits tickets</text>
<text class="ss" x="296" y="357">Also comments, status changes, assignees, ticket links</text>
<rect x="604" y="345" width="62" height="16" rx="3" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lb" x="635" y="357" text-anchor="middle" fill="#0b5e4f">Draft first</text>
<rect x="284" y="378" width="392" height="74" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="296" y="396" fill="#0f172a">Workspace and PR</text>
<text class="qt" x="296" y="412">“Fix it and open a PR”</text>
<text class="ss" x="296" y="427">Makes the fix in an isolated workspace; another session</text>
<text class="ss" x="296" y="441">reviews it, the review is applied, and the PR is opened</text>
<rect x="284" y="462" width="392" height="74" rx="6" fill="#eef3fb" stroke="#2f5bb7" stroke-width="1"/>
<text class="nm" x="296" y="480" fill="#244a99">Open PRs</text>
<text class="qt" x="296" y="496">“What happened with that PR?”</text>
<text class="ss" x="296" y="511">Finds and reads PRs, comments on them, and fixes them</text>
<text class="ss" x="296" y="525">Merges them</text>
<rect x="604" y="513" width="62" height="16" rx="3" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lb" x="635" y="525" text-anchor="middle" fill="#0b5e4f">Draft first</text>
<rect x="284" y="546" width="392" height="74" rx="6" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="nm" x="296" y="564" fill="#3d4554">Channel conversation history</text>
<text class="qt" x="296" y="580">“What did we decide to do about that last month?”</text>
<text class="ss" x="296" y="595">Finds posts with similar meaning in the conversations</text>
<text class="ss" x="296" y="609">stored from the channels, and answers</text>
<line x1="0" y1="632" x2="676" y2="632" stroke="#e2e8f0" stroke-width="1"/>
<rect x="0" y="637" width="12" height="12" rx="2" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="lg" x="18" y="647">Person, Slack, input</text>
<rect x="136" y="637" width="12" height="12" rx="2" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="lg" x="154" y="647">Model, LLM session</text>
<rect x="266" y="637" width="12" height="12" rx="2" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="lg" x="284" y="647">Bot code, ordinary step</text>
<rect x="416" y="637" width="12" height="12" rx="2" fill="#eef3fb" stroke="#2f5bb7" stroke-width="1"/>
<text class="lg" x="434" y="647">External service, external call</text>
<rect x="0" y="659" width="12" height="12" rx="2" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="lg" x="18" y="669">Storage (DB, table, clone)</text>
<rect x="170" y="657" width="62" height="16" rx="3" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lb" x="201" y="669" text-anchor="middle" fill="#0b5e4f">Draft first</text>
<text class="lg" x="240" y="669">Policy, check, enforcement: posts what it will do first, runs after a person replies</text>
</svg>
