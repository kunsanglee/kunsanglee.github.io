#fig-ag-weekly .mn{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:400;fill:#334155}
#fig-ag-weekly .lb{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-weekly .lg{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-weekly .vl{font-size:11px;font-weight:600;fill:#334155}</style>
