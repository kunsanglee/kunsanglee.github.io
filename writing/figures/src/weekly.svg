<title id="fig-ag-weekly-title">Weekly question threads (mid-June to late September)</title>
<desc id="fig-ag-weekly-desc">Bar chart counting, by week, the 235 threads the agent answered in the code-question channel. Nine weeks from the week of June 8: 16, 6, 3, 2, 5, 1, 7, 3, 2 (45 threads). Seven weeks from the week of August 10, after the planning team started using it: 33, 27, 26, 37, 35, 26 and 6 (190 threads); the last week, September 21, covers two days only.</desc>
