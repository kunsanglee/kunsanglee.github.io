<svg id="fig-ag-weekly" viewBox="-2 -2 680 230" width="1360" height="460" role="img" aria-labelledby="fig-ag-weekly-title fig-ag-weekly-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-weekly-title">Question threads answered per week (2026-06-10 to 09-22)</title>
<desc id="fig-ag-weekly-desc">Bar chart counting, by week, the 235 threads the agent answered in the code-question channel. The nine weeks from the week of June 8 (five days counted, from June 10) to the week of August 3 total 45 threads, 1 to 16 a week. The seven weeks from the week of August 10 to the week of September 21 total 190 threads. Leaving out the last week, September 21, which covers two days only (6 threads), that is 26 to 37 a week. The planning team started using the agent in the week of August 10; that period is shaded.</desc>
