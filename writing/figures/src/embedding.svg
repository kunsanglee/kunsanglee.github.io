#fig-ag-embedding .lb{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-embedding .lg{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-embedding .vl{font-size:11px;font-weight:600;fill:#334155}</style>
