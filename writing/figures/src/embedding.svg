<text class="hd" x="0" y="12">Storing</text>
<text class="hs" x="52" y="12">whenever a post appears in a channel · the model is not called</text>
<rect x="0" y="24" width="142" height="108" rx="6" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="nm" x="10" y="43" fill="#8a5300">1 Channel posts</text>
<text class="ss" x="10" y="58">everything, including</text>
<text class="ss" x="10" y="73">posts not addressed to</text>
<text class="ss" x="10" y="88">the agent and replies;</text>
<rect x="178" y="24" width="142" height="108" rx="6" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="nm" x="188" y="43" fill="#3d4554">2 Conversation table</text>
<text class="ss" x="188" y="57">in PostgreSQL</text>
<text class="ss" x="188" y="71">text and vector per row</text>
<text class="ss" x="188" y="85">edit clears the vector</text>
<text class="ss" x="188" y="99">delete only sets a flag</text>
<text class="ss" x="188" y="113">pgvector index,</text>
<text class="ss" x="188" y="127">cosine distance</text>
<rect x="356" y="24" width="142" height="108" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="366" y="43" fill="#0f172a">3 Embedding job</text>
<rect x="535" y="25" width="140" height="106" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text class="nm" x="544" y="43" fill="#334155">4 Embedding server</text>
<text class="ss" x="544" y="58">EmbeddingGemma 2</text>
<text class="ss" x="544" y="73">768-number vectors</text>
<text class="ss" x="544" y="88">first 1,024 tokens only</text>
<text class="ss" x="544" y="103">same Mac as the bot</text>
<text class="hd" x="0" y="170">Retrieving</text>
<text class="hs" x="68" y="170">only when the model judges it needs something from outside the thread</text>
<rect x="0" y="182" width="142" height="80" rx="6" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="nm" x="10" y="201" fill="#8a5300">1 Person's question</text>
<text class="ss" x="10" y="216">“What did we decide</text>
<text class="ss" x="10" y="231">about the release</text>
<rect x="179" y="183" width="140" height="78" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="2"/>
<text class="nm" x="188" y="201" fill="#5a3fa6">2 Model</text>
<rect x="356" y="182" width="142" height="80" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
<text class="nm" x="366" y="201" fill="#334155">3 Same server</text>
<text class="ss" x="366" y="216">query also becomes a</text>
<text class="ss" x="366" y="231">768-number vector</text>
<rect x="534" y="182" width="142" height="80" rx="6" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="nm" x="544" y="201" fill="#3d4554">4 Conversation table</text>
<text class="ss" x="10" y="103">DMs are not stored</text>
<text class="ss" x="366" y="57">every 5 s: posts with no</text>
<text class="ss" x="366" y="71">vector, a few dozen each</text>
<text class="ss" x="366" y="85">skips: under 10 chars,</text>
<text class="ss" x="366" y="99">original alert posts</text>
<text class="ss" x="366" y="113">replies: +200 chars each</text>
<text class="ss" x="366" y="127">from parent, prior reply</text>
<text class="ss" x="10" y="246">cadence last month?”</text>
<text class="mn" x="188" y="215">channel_history</text>
<text class="ss" x="188" y="229">chooses search terms,</text>
<text class="ss" x="188" y="242">picks matching posts</text>
<text class="ss" x="188" y="255">and answers from them</text>
<text class="ss" x="544" y="215">20 posts closest in</text>
<text class="ss" x="544" y="228">meaning (up to 40)</text>
<text class="ss" x="544" y="241">first 300 chars of body,</text>
<text class="ss" x="544" y="254">80 of parent post</text>
<text class="ss" x="0" y="313">If the embedding server can't be reached, vector building pauses briefly and retries.</text>
<text class="ss" x="0" y="327">Original text keeps being stored, and search falls back to time order.</text>
