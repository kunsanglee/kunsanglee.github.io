<svg id="fig-ag-embedding" viewBox="-2 -2 680 360" width="1360" height="720" role="img" aria-labelledby="fig-ag-embedding-title fig-ag-embedding-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-embedding-title">Channel posts are stored as vectors and found by meaning when needed</title>
<desc id="fig-ag-embedding-desc">Storing: posts in the channels the agent listens to are saved in the channel-conversation table; every 5 seconds the embedding job reads posts that have no vector yet, a few dozen at a time, has the EmbeddingGemma 2 server running on the same Mac as the bot turn them into vectors of 768 numbers, and saves the vectors in the same rows. Retrieving: when the model judges it necessary, it sends search terms with the channel_history tool; the same server turns the query into a vector, the table returns the 20 closest posts (up to 40), and the model picks its evidence and answers. If the embedding server cannot be reached, vector building pauses briefly and retries; original text keeps being stored and search falls back to time order.</desc>
<defs><marker id="fig-ag-embedding-ah-bot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1c2433"/></marker><marker id="fig-ag-embedding-ah-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker><marker id="fig-ag-embedding-ah-human" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b26b00"/></marker><marker id="fig-ag-embedding-ah-model" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b4fbb"/></marker><marker id="fig-ag-embedding-ah-local" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker><marker id="fig-ag-embedding-ah-store" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6577"/></marker></defs>
