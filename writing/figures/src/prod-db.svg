<svg id="fig-ag-prod-db" viewBox="-2 -2 680 318" width="1360" height="636" role="img" aria-labelledby="fig-ag-prod-db-title fig-ag-prod-db-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-prod-db-title">How a production database query gets executed</title>
<desc id="fig-ag-prod-db-desc">When the model calls the production database query tool, write requests are denied. For reads, the bot code measures the estimated cost from the query plan (EXPLAIN) just before the call, and denies the query if the cost cannot be measured. If the estimated cost is at or under the limit (10,000 by default) the query runs right away; if it is over, it runs only when a person has replied or added an approval reaction after the bot's last post. Otherwise it is denied and the reason is returned to the model, which tells the thread, gets an answer, and calls again.</desc>
<defs><marker id="fig-ag-prod-db-ah-allow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e7d4f"/></marker><marker id="fig-ag-prod-db-ah-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b23a32"/></marker><marker id="fig-ag-prod-db-ah-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker><marker id="fig-ag-prod-db-ah-human" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b26b00"/></marker></defs>
<style>#fig-ag-prod-db text{font-family:'Pretendard','Noto Emoji GT',sans-serif}
