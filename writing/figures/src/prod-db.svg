<rect x="501" y="33" width="22" height="14" fill="#ffffff"/>
<text class="ss" x="512" y="44" text-anchor="middle" fill="#25663f">Yes</text>
<path d="M160,80 L160,123" fill="none" stroke="#b23a32" stroke-width="1" marker-end="url(#fig-ag-prod-db-ah-deny)"/>
<rect x="165" y="93" width="24" height="14" fill="#ffffff"/>
<text class="ss" x="168" y="104" fill="#9a2f28">Yes</text>
<path d="M304,80 L304,123" fill="none" stroke="#b23a32" stroke-width="1" marker-end="url(#fig-ag-prod-db-ah-deny)"/>
<rect x="309" y="93" width="72" height="14" fill="#ffffff"/>
<text class="ss" x="312" y="104" fill="#9a2f28">can't measure</text>
<path d="M440,80 L440,115" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-prod-db-ah-grey)"/>
<rect x="445" y="93" width="78" height="14" fill="#ffffff"/>
<text class="ss" x="448" y="104">No, over limit</text>
<path d="M512,150 L600,150 A6,6 0 0 0 606,144 L606,81" fill="none" stroke="#2e7d4f" stroke-width="1" marker-end="url(#fig-ag-prod-db-ah-allow)"/>
<rect x="541" y="133" width="22" height="14" fill="#ffffff"/>
<text class="ss" x="552" y="144" text-anchor="middle" fill="#25663f">Yes</text>
<path d="M440,184 L440,211" fill="none" stroke="#b23a32" stroke-width="1" marker-end="url(#fig-ag-prod-db-ah-deny)"/>
<rect x="445" y="189" width="34" height="14" fill="#ffffff"/>
<text class="ss" x="448" y="200" fill="#9a2f28">No</text>
<path d="M380,248 L58,248 A6,6 0 0 1 52,242 L52,81" fill="none" stroke="#b26b00" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#fig-ag-prod-db-ah-human)"/>
<rect x="92" y="231" width="248" height="14" fill="#ffffff"/>
<text class="ss" x="216" y="242" text-anchor="middle" fill="#8a5300">posts in the thread, gets an answer, calls again</text>
<line x1="0" y1="296" x2="676" y2="296" stroke="#e2e8f0" stroke-width="1"/>
<rect x="0" y="20" width="104" height="60" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="52" y="39" text-anchor="middle" fill="#5a3fa6">Model calls</text>
<text class="mn" x="52" y="54" text-anchor="middle">db_query</text>
<text class="sb" x="52" y="69" text-anchor="middle">on production DB</text>
<path d="M160,20 L196,50 L160,80 L124,50 Z" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="nm" x="160" y="54" text-anchor="middle" fill="#0b5e4f">Write?</text>
<rect x="241" y="21" width="126" height="58" rx="6" fill="#e8f4f1" stroke="#0f7a66" stroke-width="2"/>
<text class="nm" x="304" y="39" text-anchor="middle" fill="#0b5e4f">Estimate the cost</text>
<text class="sb" x="304" y="54" text-anchor="middle">query plan (EXPLAIN)</text>
<text class="sb" x="304" y="69" text-anchor="middle">bot code, before run</text>
<path d="M440,20 L488,50 L440,80 L392,50 Z" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="nm" x="440" y="54" text-anchor="middle" fill="#0b5e4f">≤ limit?</text>
<text class="ss" x="440" y="12" text-anchor="middle">limit: 10,000 by default</text>
<rect x="536" y="20" width="140" height="60" rx="6" fill="#edf6f0" stroke="#2e7d4f" stroke-width="1"/>
<text class="nm" x="606" y="46" text-anchor="middle" fill="#25663f">Run</text>
<text class="sb" x="606" y="61" text-anchor="middle">result to the model</text>
<rect x="96" y="124" width="128" height="66" rx="6" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="nm" x="160" y="143" text-anchor="middle" fill="#9a2f28">Deny</text>
<text class="sb" x="160" y="158" text-anchor="middle">writes: development</text>
<rect x="248" y="124" width="112" height="66" rx="6" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="nm" x="304" y="143" text-anchor="middle" fill="#9a2f28">Deny</text>
<text class="sb" x="304" y="158" text-anchor="middle">cost could not</text>
<path d="M440,116 L512,150 L440,184 L368,150 Z" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="nm" x="440" y="147" text-anchor="middle" fill="#0b5e4f">Human reply?</text>
<text class="ss" x="440" y="162" text-anchor="middle">reply, 👍 or ✅</text>
<rect x="380" y="212" width="296" height="66" rx="6" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="nm" x="390" y="231" fill="#9a2f28">Deny, and return the reason to the model</text>
<text class="ss" x="390" y="246">model posts the estimated cost, row count and limit</text>
<text class="ss" x="390" y="261">in the thread, then retries after a reply, 👍 or ✅</text>
<text class="sb" x="160" y="173" text-anchor="middle">and staging DBs only</text>
<text class="sb" x="304" y="173" text-anchor="middle">be measured</text>
<text class="ss" x="676" y="181" text-anchor="end">counted only after the bot's last post</text>
<rect x="0" y="299" width="12" height="12" rx="2" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="lg" x="18" y="309">Model</text>
<rect x="62" y="299" width="12" height="12" rx="2" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lg" x="80" y="309">Policy, checks</text>
<rect x="169" y="299" width="12" height="12" rx="2" fill="#edf6f0" stroke="#2e7d4f" stroke-width="1"/>
<text class="lg" x="187" y="309">Allow, run</text>
<rect x="256" y="299" width="12" height="12" rx="2" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="lg" x="274" y="309">Deny</text>
<rect x="314" y="299" width="12" height="12" rx="2" fill="#ffffff" stroke="#b26b00" stroke-width="1" stroke-dasharray="4 4"/>
<text class="lg" x="332" y="309">Path that waits for a person's answer</text>
</svg>
