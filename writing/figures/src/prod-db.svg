#fig-ag-prod-db .hs{font-size:11px;font-weight:500;fill:#64748b}
#fig-ag-prod-db .nm{font-size:12px;font-weight:600;fill:#0f172a}
#fig-ag-prod-db .sb{font-size:11px;font-weight:400;fill:#475569}
#fig-ag-prod-db .ss{font-size:10.5px;font-weight:400;fill:#475569}
#fig-ag-prod-db .mn{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:400;fill:#334155}
#fig-ag-prod-db .lb{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-prod-db .lg{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-prod-db .vl{font-size:11px;font-weight:600;fill:#334155}</style>
<rect x="-2" y="-2" width="680" height="318" fill="#ffffff"/>
<path d="M104,50 L123,50" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-prod-db-ah-grey)"/>
<path d="M196,50 L239,50" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-prod-db-ah-grey)"/>
<rect x="201" y="33" width="34" height="14" fill="#ffffff"/>
<text class="ss" x="218" y="44" text-anchor="middle">No</text>
<path d="M368,50 L391,50" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-prod-db-ah-grey)"/>
