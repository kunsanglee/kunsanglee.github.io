<svg id="fig-ag-architecture" viewBox="-2 -2 680 486" width="1360" height="972" role="img" aria-labelledby="fig-ag-architecture-title fig-ag-architecture-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-architecture-title">Overall architecture of the agent</title>
<desc id="fig-ag-architecture-desc">One agent session per Slack thread. Inside the agent host, a single Node process, event intake receives Slack events and the dispatcher sends them, in order, to a thread session or a channel session. A thread session is one Claude Agent SDK session per thread. Each tool call is checked just before it runs by the tool policy, a pure function that returns allow or deny. The session uses agent-only tools (post reply, DB query, ticket, PR; tools not on the list are denied), which call the external services: the service DB for development, staging and production, Sentry, the issue tracker, code hosting, and embedding. Replies are posted back to Slack. The dispatcher writes history and channel post text to the agent storage tables in the agent's own PostgreSQL; the tools write execution records and usage there and search past conversations. The thread session reads read-only repository clones. Every 5 seconds the embedding job turns posts without a vector into vectors and stores them.</desc>
