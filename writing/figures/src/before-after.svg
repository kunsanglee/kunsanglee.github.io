<svg id="fig-ag-before-after" viewBox="-2 -2 680 550" width="1360" height="1100" role="img" aria-labelledby="fig-ag-before-after-title fig-ag-before-after-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-before-after-title">From code that managed the stages to code that decides only whether to execute</title>
<desc id="fig-ag-before-after-desc">Part 1 agent: a person's post went to a task stage table (awaiting approval, in progress, done, kept in the DB) and a phrase match that counted as approval only the exact phrase approve &lt;code&gt;, then moved to the next stage. Each added flow added stages and branches, and heavy production DB queries were forbidden only by a prompt instruction. Redesign: the model judges what the post means and calls a tool; the policy function decide() returns allow or deny from the tool, its arguments, session facts, and the estimated cost of a production DB query. On a deny the reason goes back to the model.</desc>
<defs><marker id="fig-ag-before-after-ah-allow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e7d4f"/></marker><marker id="fig-ag-before-after-ah-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b23a32"/></marker><marker id="fig-ag-before-after-ah-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker><marker id="fig-ag-before-after-ah-model" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b4fbb"/></marker><marker id="fig-ag-before-after-ah-store" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6577"/></marker></defs>
<style>#fig-ag-before-after text{font-family:'Pretendard','Noto Emoji GT',sans-serif}
#fig-ag-before-after .hd{font-size:12px;font-weight:700;fill:#0f172a}
#fig-ag-before-after .hs{font-size:11px;font-weight:500;fill:#64748b}
#fig-ag-before-after .nm{font-size:12px;font-weight:600;fill:#0f172a}
#fig-ag-before-after .sb{font-size:11px;font-weight:400;fill:#475569}
#fig-ag-before-after .ss{font-size:10.5px;font-weight:400;fill:#475569}
#fig-ag-before-after .mn{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:400;fill:#334155}
#fig-ag-before-after .lb{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-before-after .lg{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-before-after .vl{font-size:11px;font-weight:600;fill:#334155}</style>
<rect x="-2" y="-2" width="680" height="550" fill="#ffffff"/>
<rect x="0" y="0" width="676" height="172" rx="6" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1"/>
<text class="hd" x="12" y="19">Part 1 agent</text>
<text class="hs" x="91" y="19">Code managed the task stages</text>
<path d="M108,75 L129,75" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-grey)"/>
<path d="M316,75 L337,75" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-grey)"/>
<path d="M500,75 L521,75" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-grey)"/>
<rect x="12" y="32" width="96" height="86" rx="6" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="nm" x="22" y="51" style="fill:#8a5300">Person's post</text>
<rect x="130" y="32" width="186" height="86" rx="6" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="nm" x="140" y="51" style="fill:#3d4554">Task stage table</text>
<text class="sb" x="140" y="66">awaiting approval → in progress</text>
<text class="sb" x="140" y="81">→ done, kept in the DB;</text>
<text class="sb" x="140" y="96">what could be said at each</text>
<text class="sb" x="140" y="111">stage was fixed in code</text>
<rect x="338" y="32" width="162" height="86" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="348" y="51" style="fill:#0f172a">Phrase match</text>
<text class="sb" x="348" y="66">counted as approval only</text>
<text class="sb" x="348" y="81">when “approve &lt;code&gt;”</text>
<text class="sb" x="348" y="96">was sent exactly</text>
<rect x="522" y="32" width="142" height="86" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="532" y="51" style="fill:#0f172a">Next stage</text>
<text class="sb" x="532" y="66">to in progress</text>
<text class="sb" x="12" y="139"><tspan style="font-weight:700;fill:#0f172a">When flows grew.</tspan> Each added flow (tickets, code work, account linking) added stages and branches with it</text>
<text class="sb" x="12" y="156"><tspan style="font-weight:700;fill:#0f172a">Heavy production DB queries.</tspan> Forbidden by a prompt instruction; whether it held was up to the model</text>
<rect x="0" y="184" width="676" height="262" rx="6" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1"/>
<text class="hd" x="12" y="203">Redesign</text>
<text class="hs" x="76" y="203">Code decides only whether execution is allowed</text>
<path d="M108,252 L129,252" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-grey)"/>
<path d="M298,240 L343,240" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-grey)"/>
<path d="M344,266 L299,266" fill="none" stroke="#b23a32" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#fig-ag-before-after-ah-deny)"/>
<path d="M516,234 L539,234" fill="none" stroke="#2e7d4f" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-allow)"/>
<path d="M516,270 L539,270" fill="none" stroke="#b23a32" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-deny)"/>
<path d="M290,310 L290,305 A6,6 0 0 1 296,299 L384,299 A6,6 0 0 0 390,293 L390,289" fill="none" stroke="#5b6577" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-store)"/>
<path d="M470,310 L470,289" fill="none" stroke="#5b6577" stroke-width="1" marker-end="url(#fig-ag-before-after-ah-store)"/>
<rect x="12" y="216" width="96" height="72" rx="6" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="nm" x="22" y="235" style="fill:#8a5300">Person's post</text>
<rect x="130" y="216" width="168" height="72" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="140" y="235" style="fill:#5a3fa6">Judges meaning</text>
<text class="sb" x="140" y="250">reads the thread posts, judges</text>
<text class="sb" x="140" y="265">approval or revision request,</text>
<text class="sb" x="140" y="280">then calls a tool</text>
<rect x="345" y="217" width="170" height="70" rx="6" fill="#e8f4f1" stroke="#0f7a66" stroke-width="2"/>
<text class="nm" x="354" y="235" style="fill:#0b5e4f">Policy function</text>
<text class="mn" x="506" y="235" text-anchor="end" style="fill:#0b5e4f">decide()</text>
<text class="sb" x="354" y="250">allow or deny from tool,</text>
<text class="sb" x="354" y="265">arguments and session facts;</text>
<text class="sb" x="354" y="280">one rule per tool category</text>
<rect x="540" y="216" width="124" height="34" rx="6" fill="#edf6f0" stroke="#2e7d4f" stroke-width="1"/>
<text class="nm" x="550" y="238" style="fill:#25663f">Allow</text>
<rect x="540" y="254" width="124" height="34" rx="6" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="nm" x="550" y="276" style="fill:#9a2f28">Deny</text>
<rect x="130" y="310" width="190" height="78" rx="6" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="nm" x="140" y="329" style="fill:#3d4554">Session facts</text>
<text class="sb" x="140" y="344">who posted, where and when;</text>
<text class="sb" x="140" y="359">whether it is the agent's own post;</text>
<text class="sb" x="140" y="374">execution record</text>
<rect x="342" y="310" width="322" height="78" rx="6" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="nm" x="352" y="329" style="fill:#0b5e4f">Estimated cost</text>
<text class="sb" x="352" y="344">before a production DB query runs,</text>
<text class="sb" x="352" y="359">measured with EXPLAIN;</text>
<text class="sb" x="352" y="374">over the limit: deny</text>
<text class="sb" x="12" y="407"><tspan style="font-weight:700;fill:#0f172a">Approval.</tspan> The code checks only whether a person's reply follows the agent's post in the thread.</text>
<text class="sb" x="12" y="422">It does not read the reply, and it denies if an execution record for the same request already exists</text>
<text class="sb" x="12" y="439"><tspan style="font-weight:700;fill:#0f172a">New tools.</tspan> One line in the tool table: name and category (read, order-dependent write, alert-session write, input-dependent, …)</text>
<rect x="0" y="458" width="12" height="12" rx="2" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="lg" x="18" y="468">People, Slack, input</text>
<rect x="126" y="458" width="12" height="12" rx="2" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="lg" x="144" y="468">Model, LLM session</text>
<rect x="253" y="458" width="12" height="12" rx="2" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="lg" x="271" y="468">Bot code, ordinary step</text>
<rect x="397" y="458" width="12" height="12" rx="2" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lg" x="415" y="468">Policy, check, enforcement (focus)</text>
<rect x="0" y="474" width="12" height="12" rx="2" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="lg" x="18" y="484">Storage (DB, tables, clones)</text>
<rect x="165" y="474" width="12" height="12" rx="2" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="lg" x="183" y="484">Deny, failure, forbidden</text>
<rect x="308" y="474" width="12" height="12" rx="2" fill="#edf6f0" stroke="#2e7d4f" stroke-width="1"/>
<text class="lg" x="326" y="484">Allow, pass, done</text>
<path d="M423,480 L450,480" fill="none" stroke="#b23a32" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#fig-ag-before-after-ah-deny)"/>
<text class="lg" x="457" y="484">deny reason returned to the model</text>
<line x1="0" y1="496" x2="676" y2="496" stroke="#e2e8f0" stroke-width="1"/>
<text class="sb" x="0" y="513">The redesign's policy function is a pure function that calls nothing external. The code has no stages and no list of</text>
<text class="sb" x="0" y="528">accepted wording. It decides from the order of posts and the execution record alone, so the code needs no change</text>
<text class="sb" x="0" y="543">however a person words an approval.</text>
</svg>
