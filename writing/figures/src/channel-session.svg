<svg id="fig-ag-channel-session" viewBox="-2 -2 680 346" width="1360" height="692" role="img" aria-labelledby="fig-ag-channel-session-title fig-ag-channel-session-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-channel-session-title">How a channel session picks which posts to answer</title>
<desc id="fig-ag-channel-session-desc">When a top-level post appears in a channel where auto-reply is allowed, the channel session (one per channel) reads it and decides only whether to reply; it does not speak in Slack directly. If it decides not to reply, the post is skipped and only that turn’s cost is recorded. If it decides to reply, a thread session is created that inherits the channel conversation read so far, and it replies in the thread. The thread session looks up past conversations in the database when needed, by meaning, time, or thread; the database stores every channel post, overwrites edits, only flags deletions, and keeps an embedding vector per post. When the channel has been quiet for a while or a day passes, the channel session is replaced with a new one and what came before does not carry over.</desc>
<defs><marker id="fig-ag-channel-session-ah-allow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e7d4f"/></marker><marker id="fig-ag-channel-session-ah-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker><marker id="fig-ag-channel-session-ah-human" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b26b00"/></marker></defs>
