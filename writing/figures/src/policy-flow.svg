<text class="lg" x="106" y="451">Model</text>
<rect x="146" y="441" width="12" height="12" rx="2" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="lg" x="164" y="451">Bot code</text>
<rect x="215" y="441" width="12" height="12" rx="2" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lg" x="233" y="451">Policy, checks</text>
<rect x="306" y="441" width="12" height="12" rx="2" fill="#eef3fb" stroke="#2f5bb7" stroke-width="1"/>
<text class="lg" x="324" y="451">External services</text>
<rect x="410" y="441" width="12" height="12" rx="2" fill="#f1f3f6" stroke="#5b6577" stroke-width="1"/>
<text class="lg" x="428" y="451">Storage</text>
<rect x="474" y="441" width="12" height="12" rx="2" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="lg" x="492" y="451">Deny</text>
<line x1="527" y1="447" x2="551" y2="447" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
<text class="lg" x="557" y="451">returned</text>
</svg>
