<rect x="-2" y="-2" width="680" height="560" fill="#ffffff"/>
<line x1="0" y1="38" x2="676" y2="38" stroke="#e2e8f0" stroke-width="1"/>
<path d="M150,92 L169,92" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-afa-ah-grey)"/>
<path d="M150,177 L169,177" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-afa-ah-grey)"/>
<path d="M150,258 L169,258" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-afa-ah-grey)"/>
<path d="M150,346 L169,346" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-afa-ah-grey)"/>
<path d="M150,442 L169,442" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-afa-ah-grey)"/>
<path d="M444,92 L463,92" fill="none" stroke="#0f7a66" stroke-width="1" marker-end="url(#fig-ag-afa-ah-policy)"/>
<path d="M444,177 L463,177" fill="none" stroke="#0f7a66" stroke-width="1" marker-end="url(#fig-ag-afa-ah-policy)"/>
