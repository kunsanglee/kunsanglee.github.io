<svg id="fig-ag-afa" viewBox="-2 -2 680 560" width="1360" height="1120" role="img" aria-labelledby="fig-ag-afa-title fig-ag-afa-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-afa-title">What agents tend to do, and the mechanisms that keep the structure from breaking anyway</title>
<desc id="fig-ag-afa-desc">Three columns pair five habits of coding agents (from the Dune document) with the mechanism agent-colleague set up for each and the check that fails when it is broken. Copying nearby code: a capability-folder shape that is right when copied. Adding to existing files: a new folder plus one line in the list. Fastest way to a passing build: import rules. Not deleting code: the old folder emptied and pinned empty. Building what was requested: the tool owner table and empty exception lists. capabilities.test.ts covers rows 1 and 2, boundaries.test.ts rows 3 to 5, and npm run typecheck row 5.</desc>
<defs><marker id="fig-ag-afa-ah-human" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b26b00"/></marker><marker id="fig-ag-afa-ah-model" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b4fbb"/></marker><marker id="fig-ag-afa-ah-bot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1c2433"/></marker><marker id="fig-ag-afa-ah-policy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f7a66"/></marker><marker id="fig-ag-afa-ah-ext" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f5bb7"/></marker><marker id="fig-ag-afa-ah-store" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6577"/></marker><marker id="fig-ag-afa-ah-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b23a32"/></marker><marker id="fig-ag-afa-ah-allow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e7d4f"/></marker><marker id="fig-ag-afa-ah-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker></defs>
