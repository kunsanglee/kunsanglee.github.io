<line x1="0" y1="501" x2="676" y2="501" stroke="#e2e8f0" stroke-width="1"/>
<text class="hd" x="0" y="12">(a) Agent habits</text>
<text class="hs" x="0" y="26">five from the Dune document</text>
<text class="hd" x="170" y="12">(b) Mechanisms in agent-colleague</text>
<text class="hs" x="170" y="26">how this project applies them</text>
<text class="hd" x="464" y="12">(c) Checks that fail if broken</text>
<text class="hs" x="464" y="26">tests and type checking</text>
<rect x="0" y="48" width="150" height="88" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="10" y="81" style="fill:#5a3fa6">01</text>
<text class="nm" x="10" y="96">Copy nearby code</text>
<text class="nm" x="10" y="111">that already works</text>
<rect x="170" y="48" width="274" height="88" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="180" y="65">A shape that is right when copied</text>
<text class="ss" x="180" y="78">each external integration goes in one capability</text>
<text class="ss" x="180" y="91">folder; folders with tools share one file layout,</text>
<text class="ss" x="180" y="104">so copying the folder next door keeps the rules</text>
<text class="mn" x="180" y="118">client, config, tools, index, testing</text>
<rect x="0" y="144" width="150" height="66" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="10" y="166" style="fill:#5a3fa6">02</text>
<text class="nm" x="10" y="181">Add to an existing file</text>
<text class="nm" x="10" y="196">rather than create one</text>
<rect x="170" y="144" width="274" height="66" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="180" y="161">New integration: new folder + one line</text>
<text class="ss" x="180" y="174">no per-service branch in a shared file; make</text>
<text class="ss" x="180" y="187">a folder and add one line to the list</text>
<text class="mn" x="180" y="201">capabilities/index.ts</text>
<rect x="0" y="218" width="150" height="80" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="10" y="247" style="fill:#5a3fa6">03</text>
<text class="nm" x="10" y="262">Pick the fastest way</text>
<text class="nm" x="10" y="277">to make the build pass</text>
<rect x="170" y="218" width="274" height="80" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="180" y="235">Import rules that block shortcuts</text>
<text class="ss" x="180" y="248">imports between folders only in allowed</text>
<text class="ss" x="180" y="261">directions; HTTP clients for external services</text>
<text class="ss" x="180" y="274">are kept only in capability folders</text>
<rect x="0" y="306" width="150" height="80" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="10" y="327" style="fill:#5a3fa6">04</text>
<text class="nm" x="10" y="342">Leave code in place</text>
<text class="nm" x="10" y="357">when unsure where</text>
<text class="nm" x="10" y="372">it is used</text>
<rect x="170" y="306" width="274" height="80" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="180" y="323">Old-style folder emptied, kept empty</text>
<text class="ss" x="180" y="336">all former integration files moved to capability</text>
<text class="ss" x="180" y="349">folders; its list of production files is pinned</text>
<text class="ss" x="180" y="362">to an empty list</text>
<text class="mn" x="180" y="376">src/tools/</text>
<rect x="0" y="394" width="150" height="96" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="10" y="423" style="fill:#5a3fa6">05</text>
<text class="nm" x="10" y="438">Build what was asked</text>
<text class="nm" x="10" y="453">even when it conflicts</text>
<text class="nm" x="10" y="468">with the system's rules</text>
<rect x="170" y="394" width="274" height="96" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="180" y="411">Off-rule code doesn't even compile</text>
<text class="ss" x="180" y="424">tools are written in a table with their owner</text>
<text class="mn" x="180" y="438">core/tools.ts TOOL_OWNER</text>
<text class="ss" x="180" y="451">every exception list outside the composition</text>
<text class="ss" x="180" y="464">root is emptied: timers, casts, HTTP clients,</text>
<text class="ss" x="180" y="477">SDK value imports, imports from outside src</text>
<rect x="464" y="48" width="212" height="162" rx="6" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="mn" x="474" y="94" style="fill:#0b5e4f">capabilities.test.ts</text>
<text class="ss" x="474" y="111"><tspan font-weight="600" fill="#0f172a">01</tspan> imports from outside own folder,</text>
<text class="ss" x="493" y="124">core and lib; the global fetch</text>
<text class="ss" x="474" y="137"><tspan font-weight="600" fill="#0f172a">02</tspan> a folder missing from the list, or</text>
<text class="ss" x="493" y="150">a list entry with no folder</text>
<rect x="465" y="219" width="210" height="214" rx="6" fill="#e8f4f1" stroke="#0f7a66" stroke-width="2"/>
<text class="mn" x="474" y="272" style="fill:#0b5e4f">boundaries.test.ts</text>
<text class="ss" x="474" y="289"><tspan font-weight="600" fill="#0f172a">03</tspan> import in a forbidden direction,</text>
<text class="ss" x="493" y="302">HTTP client outside a capability</text>
<text class="ss" x="493" y="315">folder</text>
<text class="ss" x="474" y="328"><tspan font-weight="600" fill="#0f172a">04</tspan> a file appears in <tspan class="mn">src/tools/</tspan></text>
<text class="ss" x="474" y="341"><tspan font-weight="600" fill="#0f172a">05</tspan> all six exception lists are empty;</text>
<text class="ss" x="493" y="354">a violating file fails, no exceptions</text>
<rect x="464" y="442" width="212" height="48" rx="6" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="mn" x="474" y="461" style="fill:#0b5e4f">npm run typecheck</text>
<text class="ss" x="474" y="474"><tspan font-weight="600" fill="#0f172a">05</tspan> a tool not in the <tspan class="mn">TOOL_OWNER</tspan> table</text>
<rect x="0" y="504" width="12" height="12" rx="2" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="lg" x="18" y="514">Model</text>
<rect x="65" y="504" width="12" height="12" rx="2" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="lg" x="83" y="514">Bot code</text>
<rect x="144" y="504" width="12" height="12" rx="2" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lg" x="162" y="514">Policy, checks</text>
<line x1="252" y1="510" x2="276" y2="510" stroke="#94a3b8" stroke-width="1"/>
<text class="lg" x="282" y="514">mechanism matched to the habit</text>
<line x1="464" y1="510" x2="488" y2="510" stroke="#0f7a66" stroke-width="1"/>
<text class="lg" x="494" y="514">check that fails if broken</text>
<text class="ss" x="0" y="536">Source: the five habits in (a) are taken from the Agent-friendly architecture document of the Dune project. The mechanisms in (b) and the</text>
<text class="ss" x="0" y="550">checks in (c) were built in agent-colleague, and pairing habits with mechanisms row by row is also how this project applied them.</text>
</svg>
