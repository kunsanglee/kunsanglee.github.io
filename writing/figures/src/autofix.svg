<svg id="fig-ag-autofix" viewBox="-2 -2 680 674" width="1360" height="1348" role="img" aria-labelledby="fig-ag-autofix-title fig-ag-autofix-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig-ag-autofix-title">How an error alert goes through analysis, a fix PR, and deployment to the development server</title>
<desc id="fig-ag-autofix-desc">1 The Sentry bot posts an error alert. 2 One session is opened per issue. 3 The model posts the cause analysis in the alert thread. 4 If the repository is not in ALERT_AUTOFIX_REPOS it stops at the analysis. Otherwise: 5 the model finds the causing commit and branch, 6 a code session fixes it and a PR is opened (the policy function checks only the execution record), 7 the fix commit is cherry-picked onto the deploy branch, 8 it is deployed to the development and then the staging server. The deploy tool does not accept the production server.</desc>
<defs><marker id="fig-ag-autofix-ah-human" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b26b00"/></marker><marker id="fig-ag-autofix-ah-model" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b4fbb"/></marker><marker id="fig-ag-autofix-ah-bot" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1c2433"/></marker><marker id="fig-ag-autofix-ah-policy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f7a66"/></marker><marker id="fig-ag-autofix-ah-ext" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f5bb7"/></marker><marker id="fig-ag-autofix-ah-store" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6577"/></marker><marker id="fig-ag-autofix-ah-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b23a32"/></marker><marker id="fig-ag-autofix-ah-allow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e7d4f"/></marker><marker id="fig-ag-autofix-ah-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker></defs>
<style>#fig-ag-autofix text{font-family:'Pretendard','Noto Emoji GT',sans-serif}
#fig-ag-autofix .hd{font-size:12px;font-weight:700;fill:#0f172a}
#fig-ag-autofix .hs{font-size:11px;font-weight:500;fill:#64748b}
#fig-ag-autofix .nm{font-size:12px;font-weight:600;fill:#0f172a}
#fig-ag-autofix .sb{font-size:11px;font-weight:400;fill:#475569}
#fig-ag-autofix .ss{font-size:10.5px;font-weight:400;fill:#475569}
#fig-ag-autofix .mn{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:400;fill:#334155}
#fig-ag-autofix .lb{font-size:10.5px;font-weight:500;fill:#475569}
#fig-ag-autofix .lg{font-size:10.5px;font-weight:500;fill:#475569}</style>
<rect x="-2" y="-2" width="680" height="674" fill="#ffffff"/>
<line x1="414" y1="7" x2="414" y2="34" stroke="#cbd5e1" stroke-width="1"/>
<path d="M200,46 L200,61" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-autofix-ah-grey)"/>
<line x1="414" y1="68" x2="414" y2="108" stroke="#cbd5e1" stroke-width="1"/>
<path d="M200,120 L200,135" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-autofix-ah-grey)"/>
<path d="M200,180 L200,195" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-autofix-ah-grey)"/>
<path d="M390,238 L423,238" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-autofix-ah-grey)"/>
<rect x="398" y="221" width="19" height="14" fill="#ffffff"/>
<text class="ss" x="407" y="232" text-anchor="middle">No</text>
<path d="M200,280 L200,299" fill="none" stroke="#2e7d4f" stroke-width="1" marker-end="url(#fig-ag-autofix-ah-allow)"/>
<rect x="205" y="282" width="25" height="14" fill="#ffffff"/>
<text class="ss" x="208" y="293" style="fill:#25663f">Yes</text>
<path d="M200,372 L200,387" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-autofix-ah-grey)"/>
<line x1="414" y1="388" x2="414" y2="441" stroke="#cbd5e1" stroke-width="1"/>
<path d="M200,446 L200,461" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-autofix-ah-grey)"/>
<path d="M200,520 L200,535" fill="none" stroke="#94a3b8" stroke-width="1" marker-end="url(#fig-ag-autofix-ah-grey)"/>
<line x1="414" y1="472" x2="414" y2="512" stroke="#cbd5e1" stroke-width="1"/>
<line x1="414" y1="592" x2="414" y2="632" stroke="#cbd5e1" stroke-width="1"/>
<line x1="0" y1="649" x2="676" y2="649" stroke="#e2e8f0" stroke-width="1"/>
<rect x="0" y="0" width="400" height="46" rx="23" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="nm" x="18" y="19" style="fill:#8a5300">1 Error alert post from the Sentry bot</text>
<text class="ss" x="18" y="32">another bot posts it in the alert channel</text>
<text class="ss" x="424" y="17">treated as an alert only when it is the first post</text>
<text class="ss" x="424" y="30">of a thread, written by a bot, and has a Sentry URL</text>
<rect x="0" y="62" width="400" height="58" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="12" y="80">2 One session per issue</text>
<text class="ss" x="12" y="93">opens the session with the repository, the environment, and an</text>
<text class="ss" x="12" y="106">autofix or analysis-only marker placed before the first post</text>
<text class="ss" x="424" y="78">if the same issue's session was active within</text>
<text class="ss" x="424" y="91">30 minutes, the alert is only logged and</text>
<text class="ss" x="424" y="104">not fed to the session</text>
<rect x="0" y="136" width="400" height="44" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="12" y="154" style="fill:#5a3fa6">3 Posts the cause analysis in the alert thread</text>
<text class="ss" x="12" y="167">reads the repository's code and works out the cause</text>
<path d="M200,196 L390,238 L200,280 L10,238 Z" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="nm" x="200" y="236" text-anchor="middle" style="fill:#0b5e4f">4 Autofix allowed for this repo?</text>
<text class="mn" x="200" y="251" text-anchor="middle">compared with ALERT_AUTOFIX_REPOS</text>
<rect x="424" y="208" width="252" height="60" rx="30" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="444" y="227">Stops at the analysis</text>
<text class="ss" x="444" y="240">asks a person whether to fix it;</text>
<text class="ss" x="444" y="253">with an empty list every alert ends here</text>
<rect x="0" y="300" width="400" height="72" rx="6" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="nm" x="12" y="318" style="fill:#5a3fa6">5 Finds the causing commit and branch</text>
<text class="ss" x="12" y="331">in this order, stopping at the first that matches: the cherry-pick's</text>
<text class="ss" x="12" y="344">original commit → the feature branch containing that commit →</text>
<text class="ss" x="12" y="357">the merge commit's title → the ticket key in the commit title</text>
<rect x="0" y="388" width="400" height="58" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="12" y="406">6 Fixes with a code session and opens a PR</text>
<text class="ss" x="12" y="419">implement → review → address, then push to a bot-only branch;</text>
<text class="ss" x="12" y="432">opens the PR with the causing commit's author as reviewer</text>
<text class="ss" x="424" y="398">only when the session was opened by an alert and</text>
<text class="ss" x="424" y="411">the repository is allowed, the draft and human-</text>
<text class="ss" x="424" y="424">reply checks are skipped and only the execution</text>
<text class="ss" x="424" y="437">record is checked (policy function)</text>
<rect x="0" y="462" width="400" height="58" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="12" y="480">7 Puts the fix on the deploy branch</text>
<text class="ss" x="12" y="493">cherry-picks the fix commit onto the deploy branch and pushes;</text>
<text class="ss" x="12" y="506">on a conflict it reverts and stops</text>
<rect x="0" y="536" width="400" height="98" rx="6" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="nm" x="12" y="554">8 Deploys: development → staging server</text>
<text class="ss" x="12" y="567">when every development-server build succeeds, triggers one</text>
<text class="ss" x="12" y="580">more for the staging server</text>
<text class="ss" x="12" y="593">the deploy tool accepts only two values: development and staging</text>
<text class="ss" x="12" y="606">posts the PR link, ticket, deploy branch and build numbers</text>
<text class="ss" x="12" y="619">together in one post</text>
<text class="ss" x="424" y="482">if any step fails, it stops there and reports;</text>
<text class="ss" x="424" y="495">going on to the staging server after development</text>
<text class="ss" x="424" y="508">is an order the model follows from its instructions</text>
<rect x="424" y="532" width="252" height="48" rx="6" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="ss" x="434" y="548" style="fill:#9a2f28">the production server is not among the values</text>
<text class="ss" x="434" y="561" style="fill:#9a2f28">the deploy tool accepts, so the agent cannot</text>
<text class="ss" x="434" y="574" style="fill:#9a2f28">trigger a deploy to it</text>
<text class="ss" x="424" y="602">errors in the production environment follow the</text>
<text class="ss" x="424" y="615">same steps; the fix reaches production in the next</text>
<text class="ss" x="424" y="628">regular release or a hotfix a person decides on</text>
<rect x="0" y="652" width="12" height="12" rx="2" fill="#fdf6ea" stroke="#b26b00" stroke-width="1"/>
<text class="lg" x="18" y="662">People, Slack</text>
<rect x="103" y="652" width="12" height="12" rx="2" fill="#ffffff" stroke="#1c2433" stroke-width="1"/>
<text class="lg" x="121" y="662">Bot code</text>
<rect x="182" y="652" width="12" height="12" rx="2" fill="#f3f0fa" stroke="#6b4fbb" stroke-width="1"/>
<text class="lg" x="200" y="662">Model</text>
<rect x="247" y="652" width="12" height="12" rx="2" fill="#e8f4f1" stroke="#0f7a66" stroke-width="1"/>
<text class="lg" x="265" y="662">Policy, checks</text>
<rect x="355" y="652" width="12" height="12" rx="2" fill="#fbeceb" stroke="#b23a32" stroke-width="1"/>
<text class="lg" x="373" y="662">Deny</text>
<line x1="415" y1="658" x2="439" y2="658" stroke="#2e7d4f" stroke-width="1"/>
<text class="lg" x="445" y="662">allowed, passed</text>
</svg>
