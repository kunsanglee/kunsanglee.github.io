<!doctype html>
<html lang="en">

<style>
  :root {
    --bg: #0a0807;
    --cream: #f6ecdf;
    --dim: rgba(246, 236, 223, .5);
    --faint: rgba(246, 236, 223, .16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--cream);
    overflow: hidden; overscroll-behavior: none;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  #gl {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    display: block; touch-action: none; cursor: crosshair;
  }
  .brand {
    position: fixed; left: clamp(18px, 2.8vw, 40px); top: clamp(16px, 3.4vh, 34px);
    pointer-events: none; user-select: none; margin: 0; font-weight: inherit;
  }
  .brand .mark {
    display: block; font-size: 13px; font-weight: 500; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim);
  }
  .brand .mark b { font-weight: 700; color: var(--cream); }
  .brand .sub {
    display: block; margin-top: 8px; font-size: 11px; font-weight: 500; letter-spacing: .16em;
    text-transform: uppercase; color: rgba(246, 236, 223, .4);
  }
  .count {
    position: fixed; right: clamp(18px, 2.8vw, 40px); top: clamp(16px, 3.4vh, 34px);
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em;
    color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; margin: 0;
  }
  .count b { color: var(--cream); font-weight: 600; }
  nav {
    position: fixed; left: 50%; bottom: clamp(8px, 2.2vh, 24px); transform: translateX(-50%);
    display: flex; gap: 2px; max-width: calc(100vw - 16px);
  }
  nav button {
    appearance: none; -webkit-appearance: none; background: none; border: 0; margin: 0;
    color: var(--dim); font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; padding: 15px 14px 19px; min-height: 44px; min-width: 44px;
    cursor: pointer; position: relative; display: flex; align-items: baseline; gap: 9px;
    white-space: nowrap; transition: color .35s;
  }
  nav button .n { font: 500 10px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .04em; opacity: .85; }
  nav button .bar { position: absolute; left: 14px; right: 14px; bottom: 10px; height: 1px; background: var(--faint); overflow: hidden; }
  nav button .bar i { position: absolute; inset: 0; background: var(--cream); transform-origin: 0 50%; transform: scaleX(0); }
  nav button[aria-current="step"], nav button:hover { color: var(--cream); }
  nav button:focus-visible { outline: 1px solid rgba(246, 236, 223, .55); outline-offset: -5px; border-radius: 6px; }
  .hint {
    position: fixed; right: clamp(18px, 2.8vw, 40px); bottom: clamp(22px, 3.6vh, 40px); margin: 0;
    font-size: 12px; letter-spacing: .06em; color: rgba(246, 236, 223, .46); pointer-events: none;
  }
  .hint .touch { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .hint .mouse { display: none; }
    .hint .touch { display: inline; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  #fps { position: fixed; right: 12px; top: 54px; font: 11px/1.45 ui-monospace, Menlo, monospace; color: #b8f0b0; pointer-events: none; white-space: pre; }
  .fallback { display: none; position: fixed; inset: 0; place-items: center; text-align: center; }
  .fallback p { margin: 0; font-size: clamp(40px, 9vw, 120px); font-weight: 800; letter-spacing: -.02em; color: #f2c9a8; }
  .fallback small { display: block; margin-top: 14px; font-size: 13px; color: var(--dim); letter-spacing: .08em; }
  .nogl .fallback { display: grid; }
  .nogl #gl, .nogl nav, .nogl .hint, .nogl .count { display: none; }
  @media (max-width: 1299px) { .hint { bottom: auto; top: calc(clamp(16px, 3.4vh, 34px) + 24px); } }
  @media (max-width: 760px) {
    nav button { padding: 15px 9px 19px; gap: 0; }
    nav button .t { display: none; }
    nav button[aria-current="step"] .t { display: inline; margin-left: 8px; }
    nav button .bar { left: 9px; right: 9px; }

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ setup */
const qs = new URLSearchParams(location.search);
const CAPTURE = qs.has('capture');
const SHOW_FPS = qs.has('fps');
const START = Math.min(6, Math.max(1, parseInt(qs.get('scene') || '1', 10) || 1)) - 1;
const N = 40000;

const canvas = document.getElementById('gl');
let gl = null;
try {
  gl = canvas.getContext('webgl2', {
    antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false,
    preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance'
  });
} catch (e) { gl = null; }
if (!gl) { document.documentElement.classList.add('nogl'); return; }
let HDR = !!gl.getExtension('EXT_color_buffer_float');

const COL_A = [0.92, 0.40, 0.24];   // clay
const COL_B = [1.00, 0.66, 0.30];   // amber
const COL_C = [1.00, 0.93, 0.83];   // cream

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const mix = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const outCubic = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const outBack = (x, c1) => { const u = clamp(x, 0, 1) - 1; return 1 + (c1 + 1) * u * u * u + c1 * u * u; };

/* ---------------------------------------------------------------- shaders */
const NOISE = `
vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+10.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
// simplex noise with analytic gradient (Ashima Arts / stegu, MIT)
float snoise(vec3 v, out vec3 gradient){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  vec4 m2 = m * m;
  vec4 m4 = m2 * m2;
  vec4 pdotx = vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3));
  vec4 temp = m2 * m * pdotx;
  gradient = -8.0 * (temp.x * x0 + temp.y * x1 + temp.z * x2 + temp.w * x3);
  gradient += m4.x * p0 + m4.y * p1 + m4.z * p2 + m4.w * p3;
  gradient *= 105.0;
  return 105.0 * dot(m4, pdotx);
}
// divergence-free field: grad(n1) x grad(n2)
vec3 curl(vec3 p){
  vec3 g1; vec3 g2;
  snoise(p, g1);
  snoise(p + vec3(19.7, -43.1, 7.3), g2);
  return cross(g1, g2);
}`;

const SIM_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aPos;
layout(location=1) in vec4 aVel;
layout(location=2) in vec4 aTgt;
layout(location=3) in vec4 aMeta;
layout(location=4) in vec4 aAux;
layout(location=5) in vec4 aSeed;
uniform float uDt, uTime, uPhaseT;
uniform int uMode;
uniform float uK, uZeta, uRamp, uStagger, uNoise, uNoiseFreq, uDrag, uVmax, uKick, uReset, uCamZ, uAspect;
uniform vec2 uContain;
uniform vec3 uWind, uKickC, uKickBias;
uniform vec4 uP, uQ, uPointer;
uniform mat4 uVP;
out vec4 vPos;
out vec4 vVel;
${NOISE}
float eInOut(float s){ return s < 0.5 ? 4.0*s*s*s : 1.0 - pow(-2.0*s + 2.0, 3.0) * 0.5; }
float dInOut(float s){ return s < 0.5 ? 12.0*s*s : 3.0*pow(-2.0*s + 2.0, 2.0); }
float eBack(float s, float c1){ float u = s - 1.0; return 1.0 + (c1 + 1.0)*u*u*u + c1*u*u; }
float dBack(float s, float c1){ float u = s - 1.0; return 3.0*(c1 + 1.0)*u*u + 2.0*c1*u; }
float eOut(float s){ s = 1.0 - s; return 1.0 - s*s*s; }
vec2 rot(vec2 v, float a){ float c = cos(a); float s = sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
vec3 cloud(vec3 p, float swirl){
  vec3 q = p * vec3(0.62, 1.0, 1.5);
  float r = length(q);
  vec3 f = -p * max(r - uContain.x, 0.0) * uContain.y;
  f.xy += vec2(-q.y, q.x) * swirl / (0.3 + r);
  return f;
}

void main(){
  vec3 p = aPos.xyz;
  vec3 v = aVel.xyz;
  float st = uReset > 0.5 ? 0.0 : aVel.w;
  float br = aPos.w;
  vec3 tgt = aTgt.xyz;
  float dt = uDt;
  vec3 acc = vec3(0.0);
  vec3 nz = vec3(0.0);
  if (uNoise > 0.0) nz = curl(p * uNoiseFreq + vec3(0.0, 0.0, uTime * 0.12)) * uNoise;

  if (uKick > 0.0) {
    vec3 d = p - uKickC;
    d.xy += (aSeed.xy - 0.5) * 0.6;
    d.z += (aSeed.z - 0.5) * 0.9;
    v += normalize(d + vec3(1e-4)) * uKick * (0.35 + 0.9 * aSeed.w) + uKickBias * (0.4 + 0.9 * aSeed.y);
  }

  if (uMode == 0) {                       // free: swirling curl-noise cloud
    acc += nz + cloud(p, uP.w) + uWind;
    v += acc * dt;
    v *= exp(-uDrag * dt);
  } else if (uMode == 1) {                // assemble / hold: spring to target
    float delay = aMeta.w * uStagger + aSeed.x * uP.x;
    float a = clamp((uPhaseT - delay) / uRamp, 0.0, 1.0);
    a = a * a * (3.0 - 2.0 * a);
    float k = uK * a;
    acc += (tgt - p) * k - v * (2.0 * uZeta * sqrt(k) + uDrag * (1.0 - a)) + nz * (1.0 - 0.9 * a) + cloud(p, 1.5) * (1.0 - a);
    v += acc * dt;
  } else if (uMode == 2) {                // highway: lanes, then brake into glyphs
    float laneY = aAux.x;
    float laneZ = aAux.y;
    float spd = aAux.z;
    float d = aAux.w;
    float dir = sign(spd);
    float Tb = uP.z;
    if (st > 0.0) {
      float s = clamp((uTime - st) / Tb, 0.0, 1.0);
      float m = eInOut(s);
      vec3 goal = vec3(tgt.x - dir * d * (1.0 - eBack(s, 1.3)), mix(laneY, tgt.y, m), mix(laneZ, tgt.z, m));
      vec3 gv = vec3(0.0);
      if (s < 1.0) gv = vec3(dir * d * dBack(s, 1.3), (tgt.y - laneY) * dInOut(s), (tgt.z - laneZ) * dInOut(s)) / Tb;
      acc += (goal - p) * 260.0 + (gv - v) * 26.0;
      v += acc * dt;
    } else {
      float a = uP.y;
      acc.x += (spd - v.x) * 2.8 * a;
      if (uQ.z > 0.0) {                   // bunch each lane into moving cars
        float sp = uQ.y / uQ.w;
        float u = mod(p.x + uQ.x - spd * uTime - fract(laneZ * 7.13 + 0.37) * uQ.y, uQ.y);
        float cell = floor(u / sp);
        float rel = u - (cell + 0.5) * sp;
        float h = fract(sin(cell * 12.9898 + laneZ * 78.233) * 43758.5453);
        float want = (fract(aSeed.w * 13.0) - 0.5) * mix(0.14, 0.42, h);
        acc.x += (want - rel) * 9.0 * a * uQ.z;
      }
      acc.yz +=((vec2(laneY, laneZ) - p.yz) * 34.0 - v.yz * 9.5) * a;
      acc += nz * (1.0 - a);
      v += acc * dt;
      v *= exp(-uDrag * (1.0 - a) * dt);
      if (uP.x > 0.5) {
        float xt = tgt.x - dir * d;
        float nx = p.x + v.x * dt;
        bool crossed = dir > 0.0 ? (p.x < xt && nx >= xt) : (p.x > xt && nx <= xt);
        if (crossed && v.x * dir > 0.5) st = uTime + clamp((xt - p.x) / v.x, 0.0, dt);
      }
    }
  } else if (uMode == 3) {                // rain: rise, park above, fall, land
    float rainT = uP.y;
    float drop = aAux.x;
    float parkY = aAux.y;
    if (st > 0.5) {
      float k = 160.0;
      acc += (tgt - p) * k - v * (2.0 * 0.4 * sqrt(k));
      v += acc * dt;
    } else if (rainT < drop) {
      if (p.y < parkY - 0.05) {
        acc += nz;
        acc.y += 8.5 * uP.x;
        acc.xz += ((tgt.xz - p.xz) * 2.0 - v.xz * 0.8) * uP.x;
        v += acc * dt;
        v *= exp(-0.6 * dt);
      } else {
        acc += (vec3(tgt.x, parkY, tgt.z) - p) * 40.0 - v * 12.0;
        v += acc * dt;
      }
    } else {
      acc.y -= 7.0;
      acc.xz += (tgt.xz - p.xz) * 70.0 - v.xz * 16.0;
      v += acc * dt;
      float ny = p.y + v.y * dt;
      if (v.y < 0.0 && p.y >= tgt.y && ny <= tgt.y) {
        p.y = tgt.y; v.y = -v.y * 0.1; st = 1.0;
      } else if (v.y < 0.0 && p.y < tgt.y - 0.02) {
        st = 1.0;
      }
    }
  } else if (uMode == 4) {                // shatter: rigid shards fly out and return
    vec2 C = aAux.xy;
    float r = aAux.z;
    vec2 away = C - uQ.xy;
    float dist = length(away);
    vec2 dirv = away / max(dist, 1e-3);
    float u = uP.x;
    float spd = mix(0.5, 1.05, fract(r * 7.31)) * (0.5 + 0.45 / (dist + 0.3));
    vec2 D = dirv * spd * u + vec2(0.0, -0.22 * u * u);
    float ang = (fract(r * 13.7) - 0.5) * 2.6 * u;
    vec2 rel = rot(tgt.xy - C, ang);
    float zoff = (fract(r * 5.13) - 0.5) * 1.6 * u;
    vec3 goal = vec3(C + D + rel, tgt.z + zoff);
    goal.xy += (vec2(fract(r * 3.7), fract(r * 9.1)) - 0.5) * uP.y * 0.014 * sin(uTime * 95.0 + r * 40.0);
    acc += (goal - p) * 300.0 - v * 30.0;
    v += acc * dt;
  } else if (uMode == 5) {                // collapse: vortex into one point
    float a = clamp((uPhaseT - aSeed.x * uStagger) / uRamp, 0.0, 1.0);
    a = a * a * (3.0 - 2.0 * a);
    vec3 toC = uQ.xyz - p;
    float k = uK * a;
    acc += toC * k - v * (2.0 * uZeta * sqrt(k) + uDrag * (1.0 - a));
    acc.xy += vec2(-toC.y, toC.x) * uP.x;
    acc += nz * (1.0 - a);
    v += acc * dt;
  } else if (uMode == 6) {                // bloom: spiral out of the point into the word
    float s = clamp((uPhaseT - aMeta.w * uStagger - aSeed.x * 0.12) / uRamp, 0.0, 1.0);
    float e = eBack(s, 0.9);
    vec3 c = uQ.xyz;
    float phi = uP.x * (1.0 - eOut(s)) * (0.75 + 0.5 * aSeed.y);
    vec2 rel = rot((tgt.xy - c.xy) * e, phi);
    vec3 goal = vec3(c.xy + rel, mix(c.z, tgt.z, e));
    acc += (goal - p) * 320.0 - v * 30.0;
    v += acc * dt;
  }

  if (uPointer.w > 0.0) {
    vec4 clip = uVP * vec4(p, 1.0);
    vec2 ndc = clip.xy / max(clip.w, 0.05);
    vec2 d = (ndc - uPointer.xy) * vec2(uAspect, 1.0);
    float r = length(d);
    if (r < uPointer.z) {
      float f = 1.0 - r / uPointer.z;
      v.xy += (d / max(r, 1e-4)) * f * f * uPointer.w * dt;
    }
  }
  if (uVmax > 0.0) { float sp = length(v); if (sp > uVmax) v *= uVmax / sp; }
  p += v * dt;
  if (uMode == 2 && st <= 0.0) {
    if (p.x > uQ.x) p.x -= uQ.y;
    else if (p.x < -uQ.x) p.x += uQ.y;
  }
  p.z = min(p.z, uCamZ - 0.7);
  br += (aTgt.w - br) * (1.0 - exp(-dt * 4.0));
  vPos = vec4(p, br);
  vVel = vec4(v, st);
}`;

const SIM_FS = `#version 300 es
precision mediump float;
out vec4 o;
void main(){ o = vec4(0.0); }`;

const PT_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aPos;
layout(location=1) in vec4 aVel;
layout(location=3) in vec4 aMeta;
layout(location=5) in vec4 aSeed;
uniform mat4 uVP;
uniform float uCamZ, uPx, uTime, uBright, uWarm, uWhite, uJitter, uLane;
uniform int uRMode;
uniform vec4 uR, uR2;
uniform vec3 uColA, uColB, uColC;
out vec3 vCol;
float hash(float n){ return fract(sin(n) * 43758.5453123); }
void main(){
  vec3 p = aPos.xyz;
  float ph = aSeed.x * 6.2831853 + uTime * (0.7 + aSeed.y * 1.1);
  p.xy += vec2(sin(ph), cos(ph * 1.31 + aSeed.z * 4.0)) * uJitter;

/* ------------------------------------------------------------ shape lab */
const PPU = 360, BOXW = 3.6, BOXH = 2.8;
const CW = Math.round(BOXW * PPU), CH = Math.round(BOXH * PPU);
const sc = document.createElement('canvas');
sc.width = CW; sc.height = CH;
const sx = sc.getContext('2d', { willReadFrequently: true });
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const alphaMap = new Uint8Array(CW * CH);

function clearShape() {
  sx.setTransform(1, 0, 0, 1, 0, 0);
  sx.globalCompositeOperation = 'source-over';
  sx.globalAlpha = 1;
  sx.clearRect(0, 0, CW, CH);
}
function worldSpace() { sx.setTransform(PPU, 0, 0, -PPU, CW / 2, CH / 2); }

// text block centred at world (0, cy); each line fits maxW wide and lineH tall (ink box)
function drawLines(lines, { cy = 0, maxW, lineH, gap = 0.14, weight = 800, track = 0.012 }) {
  sx.save();
  sx.setTransform(1, 0, 0, 1, 0, 0);
  sx.fillStyle = '#fff';
  sx.textAlign = 'left';
  sx.textBaseline = 'alphabetic';
  const setFont = px => { sx.font = `${weight} ${px}px ${FONT}`; if ('letterSpacing' in sx) sx.letterSpacing = `${(px * track).toFixed(2)}px`; };
  let px = 100;
  setFont(px);
  let wMax = 0, hMax = 0;
  for (const t of lines) {
    const m = sx.measureText(t);
    wMax = Math.max(wMax, m.actualBoundingBoxLeft + m.actualBoundingBoxRight);
    hMax = Math.max(hMax, m.actualBoundingBoxAscent + m.actualBoundingBoxDescent);
  }
  px *= Math.min(maxW * PPU / wMax, lineH * PPU / hMax);
  setFont(px);
  const ms = lines.map(t => sx.measureText(t));
  const hs = ms.map(m => m.actualBoundingBoxAscent + m.actualBoundingBoxDescent);
  const total = hs.reduce((a, b) => a + b, 0) + gap * PPU * (lines.length - 1);
  let y = CH / 2 - cy * PPU - total / 2;
  lines.forEach((t, i) => {
    const m = ms[i];
    const x0 = CW / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2;
    sx.fillText(t, x0, y + m.actualBoundingBoxAscent);
    y += hs[i] + gap * PPU;

// weighted, stratified sampling of the canvas alpha -> N target points (shuffled)
function sample(rand) {
  const img = sx.getImageData(0, 0, CW, CH).data;
  const P = CW * CH;
  let n = 0;
  for (let p = 0; p < P; p++) { const a = img[p * 4 + 3]; alphaMap[p] = a; if (a > 12) n++; }
  const idx = new Int32Array(n), cum = new Float64Array(n);

  for (let p = 0, j = 0; p < P; p++) {
    const a = alphaMap[p];
    if (a > 12) { tot += a; idx[j] = p; cum[j] = tot; j++; }
  }

    const r = (i + rand()) / N * tot;

    pix[i] = idx[j];
  }
  for (let i = N - 1; i > 0; i--) { const k = (rand() * (i + 1)) | 0; const t = pix[i]; pix[i] = pix[k]; pix[k] = t; }
  for (let i = 0; i < N; i++) {
    const p = pix[i];
    x[i] = ((p % CW) + rand() - CW / 2) / PPU;
    y[i] = (CH / 2 - (((p / CW) | 0) + rand())) / PPU;

const TB = 1.15;   // braking time on the highway

  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': next(); e.preventDefault(); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': prev(); e.preventDefault(); break;
    default: if (/^[1-6]$/.test(e.key)) goToScene(+e.key - 1);
  }
});

/* -------------------------------------------------------------------- UI */
const navBtns = [...document.querySelectorAll('nav button')];
const bars = navBtns.map(b => b.querySelector('.bar i'));
const curEl = document.getElementById('cur'), liveEl = document.getElementById('live');
const SPOKEN = ['Opus 5.5', 'Speed: 30% faster', 'Price: a stack of coins', 'Brain and effort: a pulsing neural network', 'Safety: a shield that shatters and rebuilds', 'Hello.'];
navBtns.forEach((b, i) => b.addEventListener('click', () => goToScene(i)));
let uiScene = -1;
const barVal = bars.map(() => '');
function syncUI(force) {
  if (force || uiScene !== sceneIdx) {
    uiScene = sceneIdx;
    navBtns.forEach((b, i) => { if (i === sceneIdx) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    curEl.textContent = String(sceneIdx + 1).padStart(2, '0');
    liveEl.textContent = SPOKEN[sceneIdx];
  }
  const prog = clamp((stepOffset[stepIdx] + stepT) / sceneDur[sceneIdx], 0, 1);
  bars.forEach((b, i) => {
    const v = i === sceneIdx ? prog.toFixed(3) : '0';
    if (barVal[i] !== v) { barVal[i] = v; b.style.transform = `scaleX(${v})`; }
  });
}

/* ------------------------------------------------------------ simulation */
function simulate(dt) {
  resetUniforms();
  const st = STEPS[stepIdx];
  U.phaseT = stepT;
  st.frame(stepT, clamp(stepT / st.dur, 0, 1));
  if (pendingKick) {
    U.kick = pendingKick.mag; U.kickBias.set(pendingKick.bias); U.reset = 1;
    pendingKick = null;
  }
  const u = simP.u;
  gl.useProgram(simP.p);
  gl.uniform1f(u.uDt, dt); gl.uniform1f(u.uTime, simTime); gl.uniform1f(u.uPhaseT, U.phaseT);
  gl.uniform1i(u.uMode, U.mode); gl.uniform1f(u.uK, U.K); gl.uniform1f(u.uZeta, U.zeta);
  gl.uniform1f(u.uRamp, U.ramp); gl.uniform1f(u.uStagger, U.stagger); gl.uniform1f(u.uNoise, U.noise);
  gl.uniform1f(u.uNoiseFreq, U.noiseFreq); gl.uniform1f(u.uDrag, U.drag); gl.uniform1f(u.uVmax, U.vmax);
  gl.uniform1f(u.uKick, U.kick); gl.uniform1f(u.uReset, U.reset); gl.uniform1f(u.uCamZ, camZ);
  gl.uniform1f(u.uAspect, aspect); gl.uniform2fv(u.uContain, U.contain); gl.uniform3fv(u.uWind, U.wind);
  gl.uniform3fv(u.uKickC, U.kickC); gl.uniform3fv(u.uKickBias, U.kickBias);
  gl.uniform4fv(u.uP, U.P); gl.uniform4fv(u.uQ, U.Q); gl.uniform4fv(u.uPointer, pointerU);
  gl.uniformMatrix4fv(u.uVP, false, VP);

  gl.bindVertexArray(vaos[cur]);
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfo);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, stateP[1 - cur]);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, stateV[1 - cur]);
  gl.enable(gl.RASTERIZER_DISCARD);
  gl.beginTransformFeedback(gl.POINTS);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.endTransformFeedback();
  gl.disable(gl.RASTERIZER_DISCARD);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, null);
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
  gl.bindVertexArray(null);
  cur = 1 - cur;

  simTime += dt;
  stepT += dt;
  while (stepT >= STEPS[stepIdx].dur) {
    const over = stepT - STEPS[stepIdx].dur;
    enter((stepIdx + 1) % STEPS.length);
    stepT = over;
  }
}
function tick(dt) {
  updatePointer(dt);
  const n = dt > 1 / 45 ? 2 : 1;
  for (let i = 0; i < n; i++) simulate(dt / n);
}

/* --------------------------------------------------------------- render */
function quad(prog, target) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : canvas.width, target ? target.h : canvas.height);
  gl.bindVertexArray(quadVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function bindTex(unit, tex, loc) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); }
function draw(dt) {
  const src = trail[ti], dst = trail[1 - ti];
  gl.disable(gl.BLEND);
  gl.useProgram(fadeP.p);
  bindTex(0, src.tex, fadeP.u.uTex);
  gl.uniform1f(fadeP.u.uDecay, R.trail > 0 ? Math.pow(R.trail, dt * 60) : 0);
  quad(fadeP, dst);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(ptP.p);
  const u = ptP.u;
  gl.uniformMatrix4fv(u.uVP, false, VP);
  gl.uniform1f(u.uCamZ, camZ);
  gl.uniform1f(u.uPx, 2.3 * dpr * clamp(Math.sqrt(innerHeight / 900), 0.8, 1.25));
  gl.uniform1f(u.uTime, simTime);
  gl.uniform1f(u.uBright, R.bright * R.gain * (HDR ? 1 : 0.6));
  gl.uniform1f(u.uWarm, R.warm); gl.uniform1f(u.uWhite, R.white); gl.uniform1f(u.uJitter, R.jitter); gl.uniform1f(u.uLane, R.lane);
  gl.uniform1i(u.uRMode, R.mode); gl.uniform4fv(u.uR, R.r); gl.uniform4fv(u.uR2, R.r2);
  gl.uniform3fv(u.uColA, COL_A); gl.uniform3fv(u.uColB, COL_B); gl.uniform3fv(u.uColC, COL_C);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.viewport(0, 0, dst.w, dst.h);
  gl.bindVertexArray(vaos[cur]);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.disable(gl.BLEND);
  ti = 1 - ti;

  gl.useProgram(downP.p);
  let s = dst;
  for (const L of levels) {
    bindTex(0, s.tex, downP.u.uTex);
    gl.uniform2f(downP.u.uTexel, 1 / s.w, 1 / s.h);
    quad(downP, L);
    s = L;
  }
  gl.useProgram(upP.p);
  let small = levels[4];
  for (let k = 3; k >= 0; k--) {
    bindTex(0, small.tex, upP.u.uTex);
    bindTex(1, levels[k].tex, upP.u.uAdd);
    gl.uniform2f(upP.u.uTexel, 1 / small.w, 1 / small.h);
    quad(upP, ups[k]);
    small = ups[k];
  }
  gl.useProgram(compP.p);
  bindTex(0, dst.tex, compP.u.uScene);
  bindTex(1, ups[0].tex, compP.u.uBloom);
  gl.uniform1f(compP.u.uExposure, R.exposure);
  gl.uniform1f(compP.u.uBloomStr, R.bloom * 0.2);
  gl.uniform1f(compP.u.uAspect, aspect);
  quad(compP, null);
  gl.bindVertexArray(null);
}
function clearTrails() {
  for (const t of trail) { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* ------------------------------------------------------------- the loop */
const perf = { frames: 0, sum: 0, list: [], js: 0 };
const fpsEl = document.getElementById('fps');
if (SHOW_FPS) fpsEl.hidden = false;
let last = 0, raf = 0, fpsShown = 0, slow = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  const t0 = performance.now();
  const ms = last ? now - last : 16.7;
  last = now;
  if (CAPTURE) return;
  perf.frames++; perf.sum += ms; if (perf.list.length < 20000) perf.list.push(ms);
  // drop to 1x pixels if frames keep running long (weaker GPUs on hi-dpi screens)
  slow = ms > 21 ? slow + 1 : Math.max(0, slow - 1);
  if (slow > 45 && dprCap > 1 && dpr > 1) { dprCap = 1; slow = 0; resize(); }
  const dt = Math.min(ms / 1000, 1 / 20);
  tick(dt);
  draw(dt);
  syncUI(false);
  perf.js += performance.now() - t0;
  if (SHOW_FPS && now - fpsShown > 500) {
    fpsShown = now;
    const recent = perf.list.slice(-60);
    const avg = recent.reduce((a, b) => a + b, 0) / Math.max(1, recent.length);
    fpsEl.textContent = `${(1000 / avg).toFixed(1)} fps\n${N.toLocaleString('en-US')} particles${HDR ? '' : '\nLDR'}`;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
});
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; });
canvas.addEventListener('webglcontextrestored', () => location.reload());

resize();
goToScene(START);
if (CAPTURE) Object.keys(BUILD).forEach(getShape);
else warmAll(400);
raf = requestAnimationFrame(loop);

/* ------------------------------------------- hooks for capture and timing */
function remaining(scene, name, t) {
  let total = -stepT, i = stepIdx, guard = 0;
  while (guard++ < STEPS.length * 2) {
    const st = STEPS[i];
    if (st.s === scene && st.name === name && (i !== stepIdx || stepT <= t)) return total + t;
    total += st.dur;
    i = (i + 1) % STEPS.length;
  }
  return 0;
}
window.__story = {
  N, get hdr() { return HDR; },
  state: () => ({ scene: sceneIdx, step: STEPS[stepIdx].name, t: +stepT.toFixed(3), time: +simTime.toFixed(3) }),
  step(n = 1) { for (let i = 0; i < n; i++) { tick(1 / 60); draw(1 / 60); } syncUI(false); return this.state(); },
  goto(i) { goToScene(i); return this.state(); },
  runTo(scene, name, t) {
    const frames = Math.round(remaining(scene, name, t) * 60);
    const quiet = Math.max(0, frames - 45);
    for (let i = 0; i < quiet; i++) tick(1 / 60);
    clearTrails();
    for (let i = quiet; i < frames; i++) { tick(1 / 60); draw(1 / 60); }
    syncUI(false);
    return this.state();
  },
  perf() {
    const l = perf.list.slice().sort((a, b) => a - b);
    const q = p => l.length ? l[Math.min(l.length - 1, Math.floor(p * l.length))] : 0;
    return { frames: perf.frames, avgFps: perf.frames ? 1000 * perf.frames / perf.sum : 0, p50ms: q(0.5), p95ms: q(0.95), p99ms: q(0.99), maxMs: l.length ? l[l.length - 1] : 0, jsMsPerFrame: perf.frames ? perf.js / perf.frames : 0 };
  },
  resetPerf() { perf.frames = 0; perf.sum = 0; perf.list = []; perf.js = 0; },
  probe(n = 60) {
    const px = new Uint8Array(4);
    const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    sync();
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { tick(1 / 60); draw(1 / 60); sync(); }
    return (performance.now() - t0) / n;
  },
  timeline: () => STEPS.map(s => ({ scene: s.s, name: s.name, dur: s.dur })),
};
})();
</script>
